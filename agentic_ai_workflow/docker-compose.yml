services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    network_mode: host
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    network_mode: host
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ollama

volumes:
  n8n_data:
  ollama_data: